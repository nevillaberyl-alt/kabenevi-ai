
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>KBAI — Kabenevi AI</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#111;--panel2:#191919;--line:#292929;--text:#f5f5f5;--muted:#999}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;height:100vh;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.app{height:100vh;display:flex}
.sidebar{width:260px;background:#0d0d0d;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#fff,#777 48%,#eee);color:#080808;display:grid;place-items:center;font-size:30px;font-weight:900;box-shadow:0 0 22px #ffffff18}
.brand strong{font-size:19px;letter-spacing:2px}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:3px}
.newchat,.nav button{border:1px solid var(--line);background:transparent;border-radius:11px;padding:12px;text-align:left;width:100%;display:flex;align-items:center;gap:11px;color:#ddd}
.newchat{background:#f1f1f1;color:#080808;font-weight:700;justify-content:center}
.nav{display:grid;gap:7px}
.nav button{border-color:transparent;color:#aaa}
.nav button:hover,.nav button.active{background:#202020;color:white;border-color:#303030}
.sidebar-bottom{margin-top:auto;color:#777;font-size:12px;padding:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.topbar span{color:#aaa;font-size:13px}
.top-actions{display:flex;gap:8px}
.smallbtn{background:#171717;border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.content{flex:1;overflow:auto;padding:28px 18px 20px}
.welcome{max-width:760px;margin:9vh auto 35px;text-align:center}
.welcome-logo{width:65px;height:65px;border-radius:19px;font-size:45px;margin:auto auto 22px}
h1{font-size:clamp(27px,5vw,42px);margin:0 0 12px;letter-spacing:-1.5px}
.subtitle{color:#999;font-size:14px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:30px}
.suggestion{border:1px solid var(--line);background:#111;border-radius:13px;padding:15px;text-align:left;color:#ddd}
.suggestion:hover{background:#1b1b1b}
.messages{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.message{display:flex;gap:12px;align-items:flex-start;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.avatar{width:30px;height:30px;border-radius:10px;background:#eee;color:#080808;display:grid;place-items:center;font-weight:900;flex-shrink:0}
.message.user .avatar{background:#292929;color:white}
.bubble{padding:4px 0;max-width:100%}
.bubble img{max-width:min(100%,500px);border-radius:13px;display:block;margin-top:10px}
.composer-wrap{padding:12px 18px 20px;background:linear-gradient(transparent,#090909 20%)}
.composer{max-width:820px;margin:auto;border:1px solid #333;background:#151515;border-radius:18px;padding:12px;box-shadow:0 10px 40px #0008}
textarea{width:100%;resize:none;min-height:48px;max-height:150px;border:0;outline:0;background:transparent;color:white;padding:8px;font-size:15px}
.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tool{background:#222;border:1px solid #333;border-radius:9px;padding:8px 10px;color:#ccc;font-size:12px}
.tool:hover{background:#333}
.send{margin-left:auto;background:#f1f1f1;color:#080808;border:0;border-radius:10px;padding:9px 15px;font-weight:800}
.send:disabled{opacity:.4;cursor:not-allowed}
.disclaimer{text-align:center;color:#666;font-size:11px;margin-top:10px}
.status{color:#aaa;font-size:12px;text-align:center;padding:8px}
.file-name{font-size:11px;color:#aaa;max-width:180px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.sidebar{width:68px;padding:14px 8px}.brand{padding:4px 4px 15px}.brand .brandtext,.nav .navtext,.sidebar-bottom{display:none}.logo{width:43px;height:43px}.newchat{font-size:0;padding:12px}.nav button{justify-content:center;padding:13px 5px;font-size:18px}.topbar{padding:0 12px}.content{padding:16px 12px}.suggestions{grid-template-columns:1fr}.composer-wrap{padding:8px 10px 13px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="logo">K</div>
    <div class="brandtext"><strong>KBAI</strong><small>KABENEVI AI</small></div>
  </div>
  <button class="newchat" onclick="newChat()">＋ <span class="navtext">New chat</span></button>
  <nav class="nav">
    <button class="active" data-mode="chat" onclick="setMode('chat',this)">◈ <span class="navtext">AI Chat</span></button>
    <button data-mode="study" onclick="setMode('study',this)">▤ <span class="navtext">Study assistant</span></button>
    <button data-mode="writing" onclick="setMode('writing',this)">✎ <span class="navtext">Writing assistant</span></button>
    <button data-mode="image" onclick="setMode('image',this)">▧ <span class="navtext">Image creator</span></button>
    <button data-mode="vision" onclick="setMode('vision',this)">◉ <span class="navtext">Understand image</span></button>
    <button data-mode="voice" onclick="setMode('voice',this)">♬ <span class="navtext">Voice assistant</span></button>
    <button data-mode="file" onclick="setMode('file',this)">▱ <span class="navtext">File assistant</span></button>
    <button data-mode="video" onclick="setMode('video',this)">▶ <span class="navtext">Video creator</span></button>
    <button data-mode="search" onclick="setMode('search',this)">⌕ <span class="navtext">Web search</span></button>
  </nav>
  <div class="sidebar-bottom">KBAI · Built with ambition</div>
</aside>

<main class="main">
  <header class="topbar">
    <strong id="modeTitle">AI Chat</strong>
    <div class="top-actions">
      <button class="smallbtn" onclick="newChat()">＋ New</button>
      <button class="smallbtn" onclick="toggleSpeech()" id="speechToggle">🔊 Voice on</button>
    </div>
  </header>

  <section class="content" id="content">
    <div class="welcome" id="welcome">
      <div class="logo welcome-logo">K</div>
      <h1>Meet your AI.</h1>
      <p class="subtitle">Welcome to Kabenevi AI. What would you like to do today?</p>
      <div class="suggestions">
        <button class="suggestion" onclick="quick('Explain a difficult topic in simple words.')">▤ &nbsp; Help me learn something</button>
        <button class="suggestion" onclick="quick('Help me write something professionally.')">✎ &nbsp; Help me write</button>
        <button class="suggestion" onclick="setMode('image')">▧ &nbsp; Create an image</button>
        <button class="suggestion" onclick="setMode('vision')">◉ &nbsp; Understand a picture</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
  </section>

  <div class="status" id="status" aria-live="polite"></div>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="prompt" placeholder="Message Kabenevi AI..." rows="2"></textarea>
      <div class="tools">
        <button class="tool" onclick="document.getElementById('upload').click()">＋ Upload</button>
        <button class="tool" onclick="startVoice()">🎙 Voice input</button>
        <span class="file-name" id="fileName"></span>
        <input id="upload" type="file" hidden accept="image/*,.txt" onchange="handleFile(this.files[0])">
        <button class="send" id="send" onclick="sendMessage()">Send ↑</button>
      </div>
    </div>
    <div class="disclaimer">KBAI can make mistakes. Check important information.</div>
  </div>
</main>
</div>

<script>
const API="https://kabenevi-ai.nevillaberyl.workers.dev";
let mode="chat",history=[],selectedFile=null,speechOn=true;
const $=id=>document.getElementById(id);

function setStatus(text){$("status").textContent=text}
function setMode(next,button){
  mode=next;
  const names={chat:"AI Chat",study:"Study Assistant",writing:"Writing Assistant",image:"Image Creator",vision:"Image Understanding",voice:"Voice Assistant",file:"File Assistant",video:"Video Creator",search:"Web Search"};
  $("modeTitle").textContent=names[next];
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.mode===next));
  const hints={chat:"Message Kabenevi AI...",study:"What would you like to learn?",writing:"What would you like to write?",image:"Describe the image you want to create...",vision:"Upload an image and ask a question...",voice:"Type a message or use voice input...",file:"Ask a question about your TXT document...",video:"Video generation is not connected yet.",search:"Web search is not connected yet."};
  $("prompt").placeholder=hints[next]||"Message Kabenevi AI...";
  setStatus(next==="video"?"Video generation needs a video provider connection.":next==="search"?"Web search needs a search provider connection.":"");
  if(next==="image")$("upload").accept="image/*";
  else if(next==="vision")$("upload").accept="image/*";
  else if(next==="file")$("upload").accept=".txt,text/plain";
  else $("upload").accept="image/*,.txt";
}
function newChat(){history=[];$("messages").innerHTML="";$("welcome").style.display="block";setStatus("");$("prompt").value=""}
function quick(text){$("prompt").value=text;$("prompt").focus()}
function addMessage(role,text,image){
  $("welcome").style.display="none";
  const item=document.createElement("div");item.className="message "+role;
  const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="user"?"Y":"K";
  const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;
  if(image){const img=document.createElement("img");img.src=image;img.alt="Generated image";bubble.appendChild(img)}
  item.append(avatar,bubble);$("messages").appendChild(item);
  $("content").scrollTop=$("content").scrollHeight;
  return bubble;
}
async function post(path,data){
  const response=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  const result=await response.json().catch(()=>({error:"The server returned an unreadable response."}));
  if(!response.ok)throw new Error(result.error||"Request failed ("+response.status+")");
  return result;
}
async function sendMessage(){
  const text=$("prompt").value.trim();
  if(!text&&!selectedFile)return;
  $("prompt").value="";
  $("send").disabled=true;setStatus("KBAI is working...");
  try{
    if(mode==="video"||mode==="search")throw new Error(mode==="video"?"Video generation is not connected yet.":"Web search is not connected yet.");
    if(mode==="image"){
      if(!text)throw new Error("Describe the image you want.");
      addMessage("user",text);
      const result=await post("/image",{prompt:text});
      addMessage("assistant","Your image is ready.",result.image);
    }else if(mode==="vision"){
      if(!selectedFile)throw new Error("Upload an image first.");
      const data=await fileBase64(selectedFile);
      addMessage("user",text||"Please describe this image.");
      const result=await post("/vision",{prompt:text||"Describe this image.",image:data,mimeType:selectedFile.type||"image/jpeg"});
      addMessage("assistant",result.reply||"No answer received.");
    }else if(mode==="file"){
      if(!selectedFile)throw new Error("Upload a TXT document first.");
      const data=await fileBase64(selectedFile);
      addMessage("user",text||"Summarise this document.");
      const result=await post("/document",{question:text||"Summarise this document.",fileName:selectedFile.name,mimeType:selectedFile.type||"text/plain",content:data});
      addMessage("assistant",result.reply||"No answer received.");
    }else{
      const question=(mode==="study"?"Help me learn. Explain simply: ":mode==="writing"?"Help me with this writing task: ":"")+text;
      if(!text)throw new Error("Type a message first.");
      addMessage("user",text);
      history.push({role:"user",content:question});
      const result=await post("/chat",{messages:history});
      const reply=result.reply||"I couldn't generate a response.";
      history.push({role:"assistant",content:reply});
      addMessage("assistant",reply);
      if(speechOn&&mode==="voice"&&"speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(reply))}
    }
    selectedFile=null;$("fileName").textContent="";
    setStatus("");
  }catch(error){addMessage("assistant","Sorry, something went wrong: "+error.message);setStatus("Please check the connection and try again.")}
  finally{$("send").disabled=false}
}
function fileBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]);reader.onerror=()=>reject(new Error("Could not read that file."));reader.readAsDataURL(file)})}
function handleFile(file){
  if(!file)return;
  if(file.size>5*1024*1024){setStatus("Please choose a file smaller than 5 MB.");return}
  if(mode==="file"&&!file.name.toLowerCase().endsWith(".txt")){setStatus("The current document reader supports TXT files only.");return}
  if(mode==="vision"&&!file.type.startsWith("image/")){setStatus("Please choose an image.");return}
  selectedFile=file;$("fileName").textContent="Attached: "+file.name;setStatus("File ready to use.");
}
function startVoice(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){setStatus("Voice input is not supported in this browser. Try Chrome.");return}
  const recognition=new SpeechRecognition();recognition.lang="en-US";recognition.interimResults=false;
  recognition.onstart=()=>setStatus("Listening...");
  recognition.onresult=e=>{$("prompt").value=e.results[0][0].transcript;setStatus("Voice captured. Press Send.")};
  recognition.onerror=()=>setStatus("Voice input could not start. Check microphone permission.");
  recognition.onend=()=>{if($("status").textContent==="Listening...")setStatus("")};
  recognition.start();
}
function toggleSpeech(){speechOn=!speechOn;$("speechToggle").textContent=speechOn?"🔊 Voice on":"🔇 Voice off";if(!speechOn&&"speechSynthesis"in window)speechSynthesis.cancel()}
$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
</script>
</body>
</html>
