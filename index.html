
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>KBAI — Kabenevi AI</title>
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#111;--line:#292929;--muted:#999;--white:#f5f5f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:#0d0d0d;border-right:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:12px;padding:8px 7px 25px}
.logo{width:43px;height:43px;border:1px solid #aaa;border-radius:13px;display:grid;place-items:center;font-size:27px;font-weight:800;background:linear-gradient(135deg,#fff,#555);color:#080808}
.brand strong{letter-spacing:2px;font-size:17px}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.5px;margin-top:5px}
.new,.tool,.sidebottom button{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#ddd;padding:12px;border-radius:10px}
.new{border-color:#444;background:#171717;margin-bottom:12px}
.tool:hover,.tool.active,.sidebottom button:hover{background:#202020;border-color:#333}
.section-label{color:#777;font-size:10px;letter-spacing:1.5px;margin:12px 8px 3px}
.sidebottom{margin-top:auto;display:grid;gap:5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}
.top span{color:#aaa;font-size:13px}
.status{font-size:11px;color:#aaa}
.content{width:min(900px,100%);margin:auto;padding:35px 22px;flex:1;display:flex;flex-direction:column}
.welcome{text-align:center;margin:35px 0 28px}
.welcome .mark{font-size:30px;color:#ccc}
h1{font-size:clamp(27px,5vw,42px);margin:12px 0}
.welcome p{color:var(--muted);font-size:14px}
.messages{display:flex;flex-direction:column;gap:16px;flex:1}
.msg{max-width:85%;padding:14px 17px;border:1px solid var(--line);border-radius:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:#202020}
.msg.bot{align-self:flex-start;background:#111}
.msg img{max-width:100%;border-radius:10px;margin-top:10px}
.composer{position:sticky;bottom:0;background:linear-gradient(transparent,#080808 18%);padding:20px 0 8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.small{border:1px solid #333;background:#111;color:#ddd;padding:8px 11px;border-radius:9px;font-size:12px}
.entry{display:flex;gap:9px;background:#151515;border:1px solid #383838;border-radius:16px;padding:9px}
.entry textarea{flex:1;resize:vertical;min-height:44px;max-height:150px;background:transparent;border:0;outline:0;color:white;padding:12px}
.send{background:#f3f3f3;color:#080808;border:0;border-radius:11px;padding:0 19px;font-weight:700}
.hint{color:#777;text-align:center;font-size:10px;margin-top:10px}
.preview{max-width:150px;max-height:120px;border-radius:9px;display:none;margin:8px 0}
.mobile-menu{display:none}
@media(max-width:720px){
.sidebar{position:fixed;z-index:5;top:0;bottom:0;left:-275px;transition:left .2s;box-shadow:10px 0 40px #000}
.sidebar.open{left:0}.mobile-menu{display:inline-block;background:none;color:white;border:0;font-size:22px}
.top{padding:0 14px}.content{padding:20px 13px}.msg{max-width:95%}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">K</div><div><strong>KBAI</strong><small>KABENEVI AI STUDIO</small></div></div>
  <button class="new" id="newChat">＋ New chat</button>
  <div class="section-label">AI TOOLS</div>
  <button class="tool active" data-mode="Chat">✧ AI Chat</button>
  <button class="tool" data-mode="Study Assistant">▤ Study Assistant</button>
  <button class="tool" data-mode="Writing Assistant">✎ Writing Assistant</button>
  <button class="tool" data-mode="Image Creator">▧ Image Creator</button>
  <button class="tool" data-mode="Image Understanding">◉ Image Understanding</button>
  <button class="tool" data-mode="Voice Assistant">◖ Voice Assistant</button>
  <button class="tool" data-mode="Web Search">⌕ Web Search</button>
  <button class="tool" data-mode="Video Creator">▶ Video Creator</button>
  <button class="tool" data-mode="File Assistant">▱ File Assistant</button>
  <div class="sidebottom">
    <div class="section-label">PERSONAL</div>
    <button id="historyButton">◷ Chat history</button>
    <button id="settingsButton">⚙ Settings</button>
  </div>
</aside>

<main class="main">
<header class="top">
  <div><button class="mobile-menu" id="menu">☰</button> <span id="modeTitle">Kabenevi AI</span></div>
  <div class="status" id="status">● Ready</div>
</header>
<section class="content">
  <div class="welcome" id="welcome">
    <div class="mark">✦</div>
    <h1>Meet your intelligence.</h1>
    <p>Ask, learn, create and explore with Kabenevi AI.</p>
  </div>
  <div class="messages" id="messages"></div>
  <div class="composer">
    <img class="preview" id="preview" alt="Selected file preview">
    <div class="tools">
      <button class="small" id="upload">＋ Attach file</button>
      <input id="fileInput" type="file" accept="image/*,.pdf,.txt,.md" hidden>
      <button class="small" id="speak">🎙 Voice input</button>
      <button class="small" id="read">🔊 Read replies: Off</button>
      <button class="small" id="clear">Clear chat</button>
    </div>
    <div class="entry">
      <textarea id="prompt" rows="1" placeholder="Message Kabenevi AI..."></textarea>
      <button class="send" id="send">Send ↑</button>
    </div>
    <div class="hint">KBAI can make mistakes. Check important information.</div>
  </div>
</section>
</main>
</div>
<script>
const API="https://kabenevi-ai.nevillaberyl.workers.dev";
const $=s=>document.querySelector(s);
const messages=$("#messages"),promptBox=$("#prompt"),statusBox=$("#status");
let mode="Chat",history=[],file=null,readReplies=false,busy=false;

function addMessage(text,who="bot",image=null){
 const el=document.createElement("div");
 el.className="msg "+who;
 el.textContent=text;
 if(image){const img=document.createElement("img");img.src=image;img.alt="Generated image";el.appendChild(img)}
 messages.appendChild(el);
 messages.scrollTop=messages.scrollHeight;
 $("#welcome").style.display="none";
 return el;
}
function setStatus(t){statusBox.textContent="● "+t}
function selectMode(next){
 mode=next;$("#modeTitle").textContent="Kabenevi "+next;
 document.querySelectorAll(".tool").forEach(b=>b.classList.toggle("active",b.dataset.mode===next));
 const hints={
 "Chat":"Message Kabenevi AI...",
 "Study Assistant":"Ask a study question...",
 "Writing Assistant":"What would you like to write?",
 "Image Creator":"Describe the image you want to create...",
 "Image Understanding":"Upload a picture and ask about it...",
 "Voice Assistant":"Type a message or use voice input...",
 "Web Search":"What would you like to search for?",
 "Video Creator":"Describe the video you want to create...",
 "File Assistant":"Ask a question about your uploaded file..."
 };
 promptBox.placeholder=hints[next]||"Message Kabenevi AI...";
 $("#sidebar").classList.remove("open");
}
document.querySelectorAll(".tool").forEach(b=>b.onclick=()=>selectMode(b.dataset.mode));
$("#menu").onclick=()=>$("#sidebar").classList.toggle("open");
$("#newChat").onclick=()=>{messages.innerHTML="";history=[];file=null;$("#preview").style.display="none";$("#welcome").style.display="block";setStatus("Ready")};
$("#clear").onclick=()=>{messages.innerHTML="";history=[];$("#welcome").style.display="block";setStatus("Ready")};

$("#upload").onclick=()=>$("#fileInput").click();
$("#fileInput").onchange=async e=>{
 file=e.target.files[0];if(!file)return;
 if(file.size>8*1024*1024){addMessage("Please choose a file smaller than 8 MB.");file=null;return}
 const img=$("#preview");
 if(file.type.startsWith("image/")){img.src=URL.createObjectURL(file);img.style.display="block"}
 else{img.style.display="none";addMessage("Selected file: "+file.name+". File reading will be connected in the next backend upgrade.")}
};

function toBase64(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(",")[1]);r.onerror=reject;r.readAsDataURL(f)})}

async function post(path,body){
 const res=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 const data=await res.json().catch(()=>({}));
 if(!res.ok)throw new Error(data.error||data.message||"Service error "+res.status);
 return data;
}
async function send(){
 const text=promptBox.value.trim();
 if(!text||busy)return;
 busy=true;$("#send").disabled=true;addMessage(text,"user");promptBox.value="";
 setStatus("Working...");
 try{
  let data;
  if(mode==="Image Creator"){
    data=await post("/image",{prompt:text});
    const image=data.image||data.url;
    if(!image)throw new Error("The image service did not return an image.");
    addMessage("Your image is ready.","bot",image);
  }else if(mode==="Image Understanding"){
    if(!file||!file.type.startsWith("image/"))throw new Error("Please attach an image first.");
    data=await post("/vision",{prompt:text,image:await toBase64(file),mimeType:file.type});
    addMessage(data.reply||data.description||"No description was returned.");
  }else if(mode==="Web Search"){
    data=await post("/search",{query:text});
    addMessage(data.reply||data.results||"No search results returned.");
  }else if(mode==="Video Creator"){
    data=await post("/video",{prompt:text});
    addMessage(data.message||data.status||"Video request submitted.");
    if(data.url)addMessage("Video link: "+data.url);
  }else if(mode==="File Assistant"){
    if(!file)throw new Error("Please attach a supported file first.");
    data=await post("/document",{question:text,fileName:file.name,mimeType:file.type,content:await toBase64(file)});
    addMessage(data.reply||"No document response returned.");
  }else{
    let message=text;
    if(mode==="Study Assistant")message="You are a helpful study tutor. Explain step by step in clear language. "+text;
    if(mode==="Writing Assistant")message="You are a writing assistant. Help improve and draft writing. "+text;
    history.push({role:"user",content:message});
    data=await post("/chat",{messages:history});
    const reply=data.reply||data.response||"I did not receive a reply.";
    history.push({role:"assistant",content:reply});
    addMessage(reply);
    if(readReplies&&"speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(reply))}
  }
  setStatus("Ready");
 }catch(err){addMessage("I couldn't complete that request: "+err.message+". The required backend service may not be connected yet.");setStatus("Connection issue")}
 finally{busy=false;$("#send").disabled=false;file=null;$("#fileInput").value="";$("#preview").style.display="none"}
}
$("#send").onclick=send;
promptBox.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("#read").onclick=()=>{readReplies=!readReplies;$("#read").textContent="🔊 Read replies: "+(readReplies?"On":"Off");if(!readReplies&&"speechSynthesis"in window)speechSynthesis.cancel()};
$("#speak").onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){addMessage("Voice input is not supported in this browser.");return}
 const rec=new SR();rec.lang="en-US";rec.onstart=()=>setStatus("Listening...");
 rec.onresult=e=>{promptBox.value=e.results[0][0].transcript;setStatus("Ready")};
 rec.onerror=()=>setStatus("Voice unavailable");rec.onend=()=>setStatus("Ready");rec.start();
};
$("#historyButton").onclick=()=>addMessage("This browser session keeps the current conversation. Permanent synced accounts and cloud history are a later upgrade.");
$("#settingsButton").onclick=()=>addMessage("Settings and account preferences will be added in a later upgrade.");
</script>
</body>
</html>
