
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabenevi AI</title>

<style>
:root {
  --gold: #d6ad45;
  --black: #080808;
  --panel: #111111;
  --border: #292929;
  --text: #f5f5f5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--black);
  color: var(--text);
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
}

.sidebar {
  width: 250px;
  background: #0d0d0d;
  border-right: 1px solid var(--border);
  padding: 22px;
  display: flex;
  flex-direction: column;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: var(--gold);
  margin-bottom: 30px;
}

.logo span {
  color: white;
}

.new-chat {
  background: var(--gold);
  color: #090909;
  border: none;
  padding: 13px;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.history-title {
  color: #999;
  margin-top: 30px;
  font-size: 13px;
}

.history {
  margin-top: 12px;
  overflow-y: auto;
}

.history-item {
  padding: 11px;
  border-radius: 8px;
  color: #ccc;
  cursor: pointer;
  font-size: 13px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.history-item:hover {
  background: #202020;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  height: 65px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 25px;
  justify-content: space-between;
}

.topbar strong {
  color: var(--gold);
}

.status {
  color: #aaa;
  font-size: 12px;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 30px 8%;
}

.welcome {
  text-align: center;
  margin: 15vh auto 40px;
}

.welcome h1 {
  font-size: 36px;
  color: var(--gold);
}

.welcome p {
  color: #aaa;
}

.message {
  display: flex;
  margin: 20px 0;
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 75%;
  padding: 14px 17px;
  border-radius: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user .bubble {
  background: #302719;
  border: 1px solid #705a2c;
}

.assistant .bubble {
  background: var(--panel);
  border: 1px solid var(--border);
}

.composer {
  padding: 18px 8%;
  border-top: 1px solid var(--border);
}

.input-area {
  display: flex;
  gap: 10px;
  background: #151515;
  border: 1px solid #383838;
  border-radius: 13px;
  padding: 9px;
}

textarea {
  flex: 1;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  resize: none;
  font: inherit;
  padding: 10px;
  max-height: 140px;
}

.send {
  background: var(--gold);
  border: none;
  border-radius: 9px;
  padding: 0 20px;
  font-weight: bold;
  cursor: pointer;
}

.send:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.note {
  color: #777;
  font-size: 11px;
  text-align: center;
  margin-top: 10px;
}

@media(max-width:700px) {
  .sidebar {
    display: none;
  }

  .chat {
    padding: 20px 15px;
  }

  .composer {
    padding: 12px;
  }

  .bubble {
    max-width: 90%;
  }

  .welcome h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<aside class="sidebar">
  <div class="logo">K<span>BAI</span></div>
  <button class="new-chat" onclick="newChat()">+ New chat</button>
  <div class="history-title">RECENT CHATS</div>
  <div class="history" id="history"></div>
</aside>

<main class="main">

  <header class="topbar">
    <strong>Kabenevi AI</strong>
    <span class="status" id="status">Checking connection...</span>
  </header>

  <section class="chat" id="chat">
    <div class="welcome" id="welcome">
      <h1>Welcome to KBAI</h1>
      <p>Your intelligent assistant. What would you like to explore today?</p>
    </div>
  </section>

  <footer class="composer">
    <div class="input-area">
      <textarea id="message" rows="1" placeholder="Message Kabenevi AI..."></textarea>
      <button class="send" id="send" onclick="sendMessage()">Send</button>
    </div>
    <div class="note">Kabenevi AI can make mistakes. Check important information.</div>
  </footer>

</main>

<script>
const API = "https://kabenevi-ai.nevillaberyl.workers.dev";

let messages = [];
let conversations = JSON.parse(
  localStorage.getItem("kbai_chats") || "[]"
);

let currentId = Date.now();

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendButton = document.getElementById("send");
const statusText = document.getElementById("status");

function saveChats() {
  localStorage.setItem("kbai_chats", JSON.stringify(conversations));
  showHistory();
}

function showHistory() {
  const history = document.getElementById("history");
  history.innerHTML = "";

  conversations.slice().reverse().forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent = item.title;
    div.onclick = () => loadChat(item.id);
    history.appendChild(div);
  });
}

function loadChat(id) {
  const selected = conversations.find(item => item.id === id);
  if (!selected) return;

  currentId = selected.id;
  messages = selected.messages || [];
  renderMessages();
}

function renderMessages() {
  chat.innerHTML = "";

  if (messages.length === 0) {
    chat.innerHTML = `
      <div class="welcome">
        <h1>Welcome to KBAI</h1>
        <p>Your intelligent assistant. What would you like to explore today?</p>
      </div>`;
    return;
  }

  messages.forEach(message => {
    addBubble(message.role, message.content);
  });

  chat.scrollTop = chat.scrollHeight;
}

function addBubble(role, content) {
  const wrapper = document.createElement("div");
  wrapper.className = "message " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = content;

  wrapper.appendChild(bubble);
  chat.appendChild(wrapper);

  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function newChat() {
  messages = [];
  currentId = Date.now();
  renderMessages();
  input.focus();
}

function saveCurrentChat() {
  if (!messages.length) return;

  let existing = conversations.find(item => item.id === currentId);

  if (!existing) {
    existing = {
      id: currentId,
      title: messages[0].content.slice(0, 35),
      messages: []
    };
    conversations.push(existing);
  }

  existing.messages = messages;
  saveChats();
}

async function checkConnection() {
  try {
    const response = await fetch(API + "/");
    const data = await response.json();

    statusText.textContent =
      data.status === "online" ? "● Online" : "Connection issue";
  } catch (error) {
    statusText.textContent = "● Offline";
  }
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || sendButton.disabled) return;

  messages.push({ role: "user", content: text });

  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  addBubble("user", text);
  input.value = "";

  const loading = addBubble("assistant", "KBAI is thinking...");
  sendButton.disabled = true;

  try {
    const response = await fetch(API + "/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed. Please try again.");
    }

    if (!data.reply) {
      throw new Error("The AI returned an empty response.");
    }

    loading.textContent = data.reply;
    messages.push({
      role: "assistant",
      content: data.reply
    });

    saveCurrentChat();

  } catch (error) {
    loading.textContent = "KBAI error: " + error.message;
  } finally {
    sendButton.disabled = false;
    chat.scrollTop = chat.scrollHeight;
    input.focus();
  }
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

showHistory();
checkConnection();
</script>

</body>
</html>
